services:
  # ==========================================================
  # 1. FastAPI Web Service (Python runtime - native WebSockets)
  # ==========================================================
  - type: web
    name: private-chat-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: private-chat-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: ENVIRONMENT
        value: production

  # ==========================================================
  # 2. React Vite Frontend (Static site with CDN & SPA rewrite)
  # ==========================================================
  - type: staticSite
    name: private-chat-frontend
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: private-chat-backend
          envVarKey: RENDER_EXTERNAL_URL

databases:
  # ==========================================================
  # 3. Managed PostgreSQL Database
  # ==========================================================
  - name: private-chat-db
    databaseName: privatechat
    user: privatechat_user
    region: oregon
    plan: free
